# What has to hold before anything lands.
#
# The four checks are the same four a contributor runs locally (see
# CONTRIBUTING.md), in the same order, so a green tick here means the same thing it
# means on a laptop. The fifth is the one that only a machine will remember to do:
# start the published entry point and prove the thing we hand users actually serves
# a panel and can write to a Mountebank.
#
# Node 20 and 22 both run, because package.json claims `engines: node >=20` and an
# unverified claim is a bug waiting for someone else's afternoon.

name: CI

on:
  push:
    branches: [main]
    tags-ignore: ['**']
  pull_request:
    branches: [main]

# Nothing here writes to the repository.
permissions:
  contents: read

# A newer push makes an older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 12

    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: yarn

      - name: Install
        run: yarn install --frozen-lockfile

      - name: Types
        run: yarn check:types

      - name: Tests
        run: yarn tests

      - name: Lint
        run: yarn lint

      - name: Build
        run: yarn build

      # ── the part a laptop forgets ─────────────────────────────────────────
      # `npx mountebank-studio` is the first thing anyone runs, so it is worth
      # proving on every commit: the server starts a Mountebank, serves the built
      # panel, forwards to the instance on one origin, and a write gets through.
      - name: Smoke test the bundle
        run: |
          set -euo pipefail
          node server/index.mjs --port 5399 --mb-port 2599 > studio.log 2>&1 &
          STUDIO=$!
          trap 'kill $STUDIO 2>/dev/null || true' EXIT

          for i in $(seq 60); do
            if curl -fsS -m 2 http://127.0.0.1:5399/mb/local/config > /dev/null; then break; fi
            if [ "$i" = 60 ]; then echo "the admin API never answered"; cat studio.log; exit 1; fi
            sleep 1
          done

          echo "— the panel is served"
          curl -fsS -m 5 http://127.0.0.1:5399/ | grep -q '<div id="root">'

          echo "— the instance answers through this origin"
          curl -fsS -m 5 http://127.0.0.1:5399/mb/local/config | grep -q '"version"'

          echo "— a first run is handed the instance's own address, not the route"
          # An environment answers "which Mountebank". The route this server forwards it
          # on is this process's business, and the panel resolves it without being told.
          boot=$(curl -fsS -m 5 http://127.0.0.1:5399/mb/bootstrap.json)
          echo "$boot" | grep -qE '"target": *"http://127\.0\.0\.1:2599"'
          if echo "$boot" | grep -q '/mb/local'; then
            echo "bootstrap.json still publishes a route: $boot"; exit 1
          fi
          # And that address is what the manifest maps the route to, so the two agree.
          curl -fsS -m 5 http://127.0.0.1:5399/mb/targets.json \
            | grep -qE '"local": *"http://127\.0\.0\.1:2599"'

          echo "— an absent port is omitted, not sent as null"
          # `port: null` is a 500 with an HTML body; no port at all is a 201 with one
          # assigned. The import screen promises the second, so the writer must not send
          # the first.
          code=$(curl -sS -o /dev/null -w '%{http_code}' -m 10 \
            -X POST http://127.0.0.1:5399/mb/local/imposters \
            -H 'content-type: application/json' \
            -d '{"protocol":"http","port":null,"stubs":[{"responses":[{"is":{"body":"x"}}]}]}')
          if [ "$code" != "500" ]; then echo "port:null answered $code, not 500"; exit 1; fi
          assigned=$(curl -sS -m 10 -X POST http://127.0.0.1:5399/mb/local/imposters \
            -H 'content-type: application/json' \
            -d '{"protocol":"http","stubs":[{"responses":[{"is":{"body":"x"}}]}]}' \
            | python3 -c 'import sys,json; print(json.load(sys.stdin).get("port",""))')
          if [ -z "$assigned" ]; then echo "no port was assigned"; exit 1; fi
          curl -fsS -m 5 -X DELETE "http://127.0.0.1:5399/mb/local/imposters/$assigned" -o /dev/null

          echo "— --origin is one value, and repeating the flag is what makes a list"
          # The panel reported a pipe-joined origin as an allowlist and printed it as the
          # fix. Mountebank hands the string straight to cors, so it answers with an
          # invalid origin no browser accepts.
          node node_modules/@mbtest/mountebank/bin/mb --port 2598 --nologfile \
            --origin "http://a.example" --origin "http://b.example" > origins.log 2>&1 &
          for i in $(seq 30); do
            if curl -fsS -m 2 http://127.0.0.1:2598/config > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS -m 5 http://127.0.0.1:2598/config \
            | grep -qE '"origin": *\[' || { echo "repeating --origin did not make an array"; exit 1; }
          hdr=$(curl -sS -D- -o /dev/null -m 5 -H 'Origin: http://a.example' http://127.0.0.1:2598/config \
            | tr -d '\r' | grep -i '^access-control-allow-origin:' || true)
          [ "$hdr" = "Access-Control-Allow-Origin: http://a.example" ] \
            || { echo "unexpected CORS header: $hdr"; exit 1; }
          curl -sS -D- -o /dev/null -m 5 -H 'Origin: http://c.example' http://127.0.0.1:2598/config \
            | tr -d '\r' | grep -qi '^access-control-allow-origin:' \
            && { echo "an unlisted origin was allowed"; exit 1; }
          pkill -f 'port 2598' 2>/dev/null || true

          echo "— everything is one file, and it is read back on the next start"
          # The store: one JSON document, written on every change, loaded with
          # --configfile at startup. A restart that loses a stub is the failure this
          # guards; so is a template sequence in a body being executed on reload.
          store=$(curl -fsS -m 5 http://127.0.0.1:5399/mb/store)
          echo "$store" | grep -q '"kept": *true' || { echo "not kept: $store"; exit 1; }
          file=$(echo "$store" | python3 -c 'import sys,json; print(json.load(sys.stdin)["path"])')
          curl -fsS -m 10 -X POST http://127.0.0.1:5399/mb/local/imposters \
            -H 'content-type: application/json' \
            -d '{"port":6399,"protocol":"http","name":"kept","stubs":[{"predicates":[{"equals":{"path":"/k"}}],"responses":[{"is":{"body":"<%- nope %>"}}]}]}' \
            -o /dev/null
          curl -fsS -m 10 -X POST http://127.0.0.1:5399/mb/local/imposters/6399/stubs \
            -H 'content-type: application/json' \
            -d '{"stub":{"predicates":[{"equals":{"path":"/two"}}],"responses":[{"is":{"body":"two"}}]}}' \
            -o /dev/null
          sleep 1
          # A heredoc cannot close on an indented terminator, so this is a one-liner.
          python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); i=d["imposters"]; assert len(i)==1, i; assert len(i[0]["stubs"])==2, i[0]["stubs"]' "$file"

          echo "— and it survives the process that wrote it"
          pkill -f 'server/index.mjs --port 5399' 2>/dev/null || true
          sleep 3
          node server/index.mjs --port 5399 --mb-port 2599 > studio2.log 2>&1 &
          for i in $(seq 60); do
            if curl -fsS -m 2 http://127.0.0.1:5399/mb/local/config > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS -m 5 http://127.0.0.1:5399/mb/local/imposters/6399 \
            | python3 -c 'import sys,json; s=json.load(sys.stdin)["stubs"]; assert len(s)==2, s'
          body=$(curl -fsS -m 5 http://127.0.0.1:6399/k)
          # --noParse: a body quoting a template must come back as it was written
          [ "$body" = "<%- nope %>" ] || { echo "body came back as: $body"; exit 1; }
          curl -fsS -m 5 -X DELETE http://127.0.0.1:5399/mb/local/imposters/6399 -o /dev/null

          echo "— the panel can move the file, and a bad path is refused"
          moved=$(mktemp -d)/mocks.json
          curl -fsS -m 10 -X PUT http://127.0.0.1:5399/mb/store \
            -H 'content-type: application/json' -H 'Origin: http://127.0.0.1:5399' \
            -d "{\"path\":\"$moved\"}" | grep -q '"kept": *true'
          [ -f "$moved" ] || { echo "the file was not written to $moved"; exit 1; }
          code=$(curl -sS -o /dev/null -w '%{http_code}' -m 10 -X PUT http://127.0.0.1:5399/mb/store \
            -H 'content-type: application/json' -H 'Origin: http://127.0.0.1:5399' \
            -d "{\"path\":\"$(dirname "$moved")\"}")
          [ "$code" = "400" ] || { echo "a directory was accepted as the store ($code)"; exit 1; }
          code=$(curl -sS -o /dev/null -w '%{http_code}' -m 10 -X PUT http://127.0.0.1:5399/mb/store \
            -H 'content-type: application/json' -H 'Origin: http://evil.example' \
            -d '{"path":"/tmp/evil.json"}')
          [ "$code" = "403" ] || { echo "another origin moved the store ($code)"; exit 1; }

          echo "— the instance this server starts writes no log file where it was run"
          # --nologfile: without it mountebank leaves mb.log in the working directory.
          if [ -f mb.log ]; then echo "mb.log was left behind"; exit 1; fi

          echo "— a write gets through the forward"
          code=$(curl -sS -o /dev/null -w '%{http_code}' -m 10 \
            -X POST http://127.0.0.1:5399/mb/local/imposters \
            -H 'Content-Type: application/json' \
            -d '{"port":6399,"protocol":"http","name":"ci","stubs":[{"responses":[{"is":{"statusCode":200,"body":"ok"}}]}]}')
          [ "$code" = "201" ] || { echo "expected 201, got $code"; cat studio.log; exit 1; }

          echo "— and the imposter it created answers"
          curl -fsS -m 5 http://127.0.0.1:6399/ | grep -q ok

          echo "— the stub endpoints keep their envelopes"
          # These three shapes are mountebank's, not ours, and they do not agree with each
          # other: POST wants { stub }, PUT wants the stub itself, and a stub with no
          # responses is refused everywhere. Sending { stub } to PUT is exactly the bug that
          # made every save of an edited stub fail, so it is asserted here against a live
          # instance rather than trusted to a comment.
          curl -fsS -m 10 -X POST http://127.0.0.1:5399/mb/local/imposters \
            -H 'Content-Type: application/json' \
            -d '{"port":6398,"protocol":"http","stubs":[{"predicates":[{"equals":{"path":"/a"}}],"responses":[{"is":{"body":"A"}}]}]}' \
            -o /dev/null
          bare='{"predicates":[{"equals":{"path":"/b"}}],"responses":[{"is":{"body":"B"}}]}'
          code=$(curl -sS -o /dev/null -w '%{http_code}' -m 10 -X PUT \
            http://127.0.0.1:5399/mb/local/imposters/6398/stubs/0 \
            -H 'Content-Type: application/json' -d "$bare")
          [ "$code" = "200" ] || { echo "::error::PUT stubs/:index must take the bare stub, got $code"; exit 1; }
          [ "$(curl -fsS -m 5 http://127.0.0.1:6398/b)" = "B" ] || { echo "::error::the edited stub does not answer"; exit 1; }

          code=$(curl -sS -o /dev/null -w '%{http_code}' -m 10 -X PUT \
            http://127.0.0.1:5399/mb/local/imposters/6398/stubs/0 \
            -H 'Content-Type: application/json' -d "{\"stub\":$bare}")
          [ "$code" = "400" ] || { echo "::error::a wrapped stub should be refused, got $code"; exit 1; }

          code=$(curl -sS -o /dev/null -w '%{http_code}' -m 10 -X POST \
            http://127.0.0.1:5399/mb/local/imposters/6398/stubs \
            -H 'Content-Type: application/json' -d "$bare")
          [ "$code" = "400" ] || { echo "::error::POST stubs needs the { stub } wrapper, got $code"; exit 1; }

          code=$(curl -sS -o /dev/null -w '%{http_code}' -m 10 -X POST \
            http://127.0.0.1:5399/mb/local/imposters/6398/stubs \
            -H 'Content-Type: application/json' -d '{"stub":{"responses":[]}}')
          [ "$code" = "400" ] || { echo "::error::a stub with no responses should be refused, got $code"; exit 1; }

          curl -fsS -m 5 -X DELETE http://127.0.0.1:5399/mb/local/imposters/6398 -o /dev/null

          echo "— it will take a forward, and refuses the three things it must"
          curl -fsS -m 5 http://127.0.0.1:5399/mb/forwarding | grep -q '"enabled":true'
          # The upstream it already forwards keeps the name it has: asking twice for one
          # instance must not mint a second route.
          curl -fsS -m 10 -X POST http://127.0.0.1:5399/mb/targets \
            -H 'Content-Type: application/json' \
            -d '{"url":"http://127.0.0.1:2599"}' | grep -q '"name":"local"'
          # A new one does get a route, named after the host with the dots flattened.
          curl -fsS -m 10 -X POST http://127.0.0.1:5399/mb/targets \
            -H 'Content-Type: application/json' \
            -d '{"url":"http://127.0.0.1:65533"}' | grep -q '"route":"/mb/127-0-0-1-65533"'
          curl -fsS -m 5 http://127.0.0.1:5399/mb/targets.json | grep -q '127-0-0-1-65533'
          # A URL that is not http(s), credentials in the URL, and another site asking.
          for body in '{"url":"ftp://x"}' '{"url":"https://u:p@x.test"}'; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' -m 5 -X POST \
              http://127.0.0.1:5399/mb/targets -H 'Content-Type: application/json' -d "$body")
            [ "$code" = "400" ] || { echo "expected 400 for $body, got $code"; exit 1; }
          done
          code=$(curl -sS -o /dev/null -w '%{http_code}' -m 5 -X POST \
            http://127.0.0.1:5399/mb/targets -H 'Content-Type: application/json' \
            -H 'Origin: https://elsewhere.test' -d '{"url":"https://x.test"}')
          [ "$code" = "403" ] || { echo "expected 403 for a foreign origin, got $code"; exit 1; }

          echo "— injection is off and the instance is loopback-only, as shipped"
          # Mountebank pretty-prints /config, so these greps tolerate the spacing.
          config=$(curl -fsS -m 5 http://127.0.0.1:5399/mb/local/config)
          echo "$config" | grep -qE '"allowInjection": *false'
          echo "$config" | grep -qE '"localOnly": *true'

      - name: Imposters survive a restart
        # The whole point of keeping them is that they come back, so the test is a restart
        # rather than the presence of a file. An explicit --datadir keeps the runner's home
        # out of it.
        run: |
          set -euo pipefail
          node server/index.mjs --port 5397 --mb-port 2597 --datadir "$PWD/mb-data" > keep.log 2>&1 &
          KEPT=$!
          for i in $(seq 60); do
            if curl -fsS -m 2 http://127.0.0.1:5397/mb/local/config > /dev/null; then break; fi
            if [ "$i" = 60 ]; then echo "never started"; cat keep.log; exit 1; fi
            sleep 1
          done
          grep -q 'Imposters kept in' keep.log || { echo "::error::the banner does not say where they are kept"; cat keep.log; exit 1; }

          curl -fsS -m 10 -X POST http://127.0.0.1:5397/mb/local/imposters \
            -H 'Content-Type: application/json' \
            -d '{"port":6397,"protocol":"http","name":"kept","stubs":[{"predicates":[{"equals":{"path":"/k"}}],"responses":[{"is":{"body":"still here"}}]}]}' \
            -o /dev/null

          kill $KEPT
          for i in $(seq 30); do curl -fsS -m 1 http://127.0.0.1:5397/ > /dev/null 2>&1 || break; sleep 1; done

          node server/index.mjs --port 5397 --mb-port 2597 --datadir "$PWD/mb-data" > keep2.log 2>&1 &
          AGAIN=$!
          trap 'kill $AGAIN 2>/dev/null || true' EXIT
          for i in $(seq 60); do
            if curl -fsS -m 2 http://127.0.0.1:5397/mb/local/config > /dev/null; then break; fi
            if [ "$i" = 60 ]; then echo "never restarted"; cat keep2.log; exit 1; fi
            sleep 1
          done

          curl -fsS -m 5 http://127.0.0.1:5397/mb/local/imposters | grep -q '"kept"' \
            || { echo "::error::the imposter did not survive the restart"; exit 1; }
          [ "$(curl -fsS -m 5 http://127.0.0.1:6397/k)" = "still here" ] \
            || { echo "::error::it came back but does not answer"; exit 1; }

          echo "— and --memory keeps nothing"
          rm -rf mb-data
          node server/index.mjs --port 5395 --mb-port 2595 --memory > mem.log 2>&1 &
          MEM=$!
          for i in $(seq 60); do
            if curl -fsS -m 2 http://127.0.0.1:5395/mb/local/config > /dev/null; then break; fi
            sleep 1
          done
          grep -q 'Not kept' mem.log || { echo "::error::--memory does not say so"; cat mem.log; exit 1; }
          kill $MEM 2>/dev/null || true

      - name: Publishable shape
        # The tarball must carry a built panel and the server, and nothing else that
        # could ship a secret or a note by accident.
        run: |
          set -euo pipefail
          files=$(npm pack --dry-run 2>&1)
          echo "$files"
          echo "$files" | grep -q 'dist/index.html'
          echo "$files" | grep -q 'server/index.mjs'
          echo "$files" | grep -q 'LICENSE'
          ! echo "$files" | grep -q 'notes/'
          ! echo "$files" | grep -q '.npmrc'
