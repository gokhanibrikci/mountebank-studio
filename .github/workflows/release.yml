# Publishing, without a token anywhere.
#
# npm supports trusted publishing: this workflow proves its own identity to the
# registry over OIDC, and the registry decides whether to trust it by comparing the
# repository and THIS FILENAME against what the package has on record. So there is
# no secret in this repository, nothing to leak and nothing to rotate — and the
# published version carries provenance, a signed statement of which commit and
# which workflow built it.
#
# Two consequences worth knowing before editing:
#
#  • RENAMING THIS FILE BREAKS PUBLISHING. The filename is part of what npm trusts.
#    Rename it on npmjs.com first (Settings → Trusted publisher), then here.
#
#  • It requires npm >= 11.5.1 and Node >= 22.14. Node 22 ships npm 10, so npm is
#    upgraded below on purpose rather than by accident.
#
# One-time setup on npmjs.com → the package → Settings → Trusted publisher:
#     provider   GitHub Actions
#     repository gokhanibrikci/mountebank-studio
#     workflow   release.yml
#
# To release: bump the version in package.json, write the CHANGELOG entry, commit,
# then push the matching tag:
#
#     git tag v0.1.1 && git push origin v0.1.1

name: Release

on:
  push:
    tags: ['v*']
  # A tag is the normal trigger. Manual runs exist because a release can fail for
  # reasons that have nothing to do with the commit — a registry-side setting, say —
  # and moving a tag back and forth to retry is worse than a button. npm's trusted
  # publisher is keyed on the repository and this filename, not on the event, so a
  # manual run publishes under the same trust.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # the OIDC token npm exchanges for publish rights

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # >= 22.14 is a trusted-publishing requirement, not a preference.
          node-version: '22'
          # NO registry-url, and that is the whole trick. Given one, setup-node
          # writes an .npmrc with `_authToken=${NODE_AUTH_TOKEN}` and then exports
          # NODE_AUTH_TOKEN as the literal placeholder XXXXX-XXXXX-XXXXX-XXXXX
          # (src/authutil.ts, unchanged in v4 and v6 — main has since fixed it). npm
          # then finds a credential it believes in, authenticates with that garbage
          # instead of falling back to OIDC, and the registry answers 404: its way of
          # saying "not authorised". Three runs failed on exactly this while the
          # trusted publisher was configured correctly all along.
          #
          # Publishing needs no registry-url: registry.npmjs.org is the default.

      - name: Upgrade npm
        # Node 22 bundles npm 10, which cannot do the OIDC exchange.
        run: |
          npm install -g npm@latest
          npm --version

      - name: The tag has to name the version being published
        # Otherwise a mistyped tag publishes something nobody asked for, under a
        # number that can never be reused: npm versions are immutable.
        run: |
          set -euo pipefail
          pkg=$(node -p "require('./package.json').version")
          if [ "$GITHUB_EVENT_NAME" != "push" ]; then
            echo "manual run — publishing what package.json says: $pkg"
            exit 0
          fi
          tag="${GITHUB_REF_NAME#v}"
          echo "tag $tag · package.json $pkg"
          [ "$tag" = "$pkg" ] || {
            echo "::error::tag v$tag does not match package.json $pkg"
            exit 1
          }

      - name: Install
        run: yarn install --frozen-lockfile

      # The same gate as CI. A tag must not be a way around it.
      - name: Types
        run: yarn check:types

      - name: Tests
        run: yarn tests

      - name: Lint
        run: yarn lint

      - name: Build
        run: yarn build

      - name: Nothing may shadow the OIDC exchange
        # The failure this guards against is silent: a token that is present but
        # worthless stops npm from ever trying OIDC, and the only symptom is a 404
        # from the registry. Fail here instead, where the message says what is wrong.
        run: |
          set -euo pipefail
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::NODE_AUTH_TOKEN is set. npm will use it and skip OIDC."
            exit 1
          fi
          # Read the files, not `npm config get`: auth keys are protected and that
          # command exits non-zero rather than printing them.
          for rc in "${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}" "$PWD/.npmrc"; do
            if [ -f "$rc" ] && grep -q "_authToken" "$rc"; then
              echo "::error::$rc configures an auth token. npm will use it and skip OIDC."
              exit 1
            fi
          done
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::error::no OIDC endpoint in the environment — is id-token: write still set?"
            exit 1
          fi
          echo "no token to fall back on, and an OIDC endpoint is present"

      - name: Publish
        # No NODE_AUTH_TOKEN: the OIDC token is the credential. --provenance attaches
        # the signed build statement shown on the package page.
        # --loglevel verbose so the OIDC exchange is legible: at the default level a
        # refusal prints as a bare ENEEDAUTH, which says nothing about which claim
        # the registry disagreed with. Nothing secret is printed at this level.
        run: npm publish --provenance --loglevel verbose
